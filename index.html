<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raju Bhai (2018) | Cricket Community</title>
<meta name="description" content="Join the Raju Bhai cricket community on Telegram.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07111f;--card:#0d1b2e;--text:#f8fafc;--muted:#a9b7ca;--line:rgba(255,255,255,.11);--accent:#19c37d;--accent2:#0ea5e9}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,rgba(14,165,233,.22),transparent 28%),radial-gradient(circle at 90% 85%,rgba(25,195,125,.18),transparent 30%),var(--bg);display:flex;justify-content:center;align-items:center;padding:24px}
.wrap{width:100%;max-width:920px}
.card{position:relative;overflow:hidden;display:grid;grid-template-columns:340px 1fr;min-height:560px;background:rgba(13,27,46,.9);border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.45)}
.left{padding:34px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,rgba(14,165,233,.13),rgba(25,195,125,.07));border-right:1px solid var(--line)}
.photo-box{width:100%;max-width:270px;text-align:center}
.photo{width:270px;height:270px;max-width:100%;object-fit:cover;border-radius:24px;display:block;border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 45px rgba(0,0,0,.4)}
.photo-label{margin-top:16px;color:#dbeafe;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
.right{padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
.tag{display:inline-flex;width:max-content;padding:8px 13px;border-radius:999px;background:rgba(25,195,125,.1);border:1px solid rgba(25,195,125,.28);color:#7ff0bd;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(36px,6vw,58px);line-height:1.02;letter-spacing:-2px}
.sub{margin-top:14px;color:var(--muted);font-size:17px;line-height:1.6;max-width:500px}
.features{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}
.feature{padding:10px 13px;border:1px solid var(--line);border-radius:12px;color:#dbe7f5;font-size:13px;background:rgba(255,255,255,.035)}
.join{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:white;font-size:17px;font-weight:800;padding:17px 22px;border-radius:15px;background:linear-gradient(110deg,var(--accent),#12a96e);box-shadow:0 14px 30px rgba(25,195,125,.23);transition:.2s}
.join:hover{transform:translateY(-3px);box-shadow:0 18px 35px rgba(25,195,125,.35)}
.small{margin-top:14px;color:#7f91a8;font-size:12px;line-height:1.5}
.footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:#71849b;font-size:12px}
.footer strong{color:#b9c8da}
@media(max-width:760px){
 body{padding:14px}.card{grid-template-columns:1fr;min-height:auto}.left{border-right:0;border-bottom:1px solid var(--line);padding:28px}.photo{width:220px;height:220px;margin:auto}.right{padding:32px 24px;text-align:center;align-items:center}h1{letter-spacing:-1px}.features{justify-content:center}.join{width:100%}.footer{width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <section class="left">
      <div class="photo-box">
        <img src="raju-bhai-photo.jpg" alt="Raju Bhai" class="photo">
        <div class="photo-label">Raju Bhai • 2018</div>
      </div>
    </section>

    <section class="right">
      <div class="tag">🏏 TNPL 24/26</div>
      <h1>Raju Bhai</h1>
      <p class="sub">Cricket updates, match information and community updates — all in one place.</p>

      <div class="features">
        <span class="feature">🏏 Cricket Updates</span>
        <span class="feature">📢 Match Updates</span>
        <span class="feature">🔥 TNPL 24/26</span>
      </div>

      <a class="join" href="https://t.me/+AgpB3HK2JmhjZjA1" target="_blank" rel="noopener">
        ✈️ Join Telegram
      </a>

      <p class="small">Tap the button above to join the Telegram community.</p>

      <div class="footer">
        © 2026 Raju Bhai (2018) &nbsp;•&nbsp; <strong>Ad Setup By Aj</strong>
      </div>
    </section>
  </main>
</div>
</body>
</html>
